<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album
    </title>
    <meta name="description"
        content="Personal profile page for Leo Alfred A. Mosquera, built for WDD 131 - Dynamic Web Fundamentals. Shares author info and key personal facts.">

    <link rel="stylesheet" href="styles/temple.css">
